name: liquid_generators
publish_to: none
version: 0.0.1-1
environment:
  sdk: ">=3.5.0 <4.0.0"
resolution: workspace
dependencies:
  # Upper bound matches source_gen/build/dart_style so the workspace can resolve
  # against Flutter SDKs whose flutter_test pins a newer test_api.
  analyzer: ">=8.1.1 <15.0.0"
  build: ^4.0.0
  code_builder: ^4.11.1
  dart_style: ^3.1.1
  flutter:
    sdk: flutter
  liquid_flutter: ^23.0.0-3
  pub_semver: ^2.2.0
  source_gen: ^4.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
