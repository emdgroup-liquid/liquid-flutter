name: liquid_flutter
description: Liquid Oxygen Components for Flutter
version: 23.0.0-8
repository: https://github.com/emdgroup-liquid/liquid-flutter
resolution: workspace
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.0.2
  flutter_animate: ^4.1.1
  haptic_feedback: ^0.6.4+3
  responsive_builder: ^0.7.0
  lucide_icons_flutter: ^3.1.9
  sensors_plus: ^7.0.0
  collection: ^1.18.0
  flutter_svg: ^2.0.10+1
  jiffy: ^6.3.1
  device_info_plus: ^11.2.0
  go_router: ^17.0.1
  mutex: ^3.1.0
  value_layout_builder: ^0.5.0
  equatable: ^2.0.7
  fuzzy: ^0.5.1
  meta: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.1.10
  flutter_oss_licenses: ">=2.0.1 <4.0.0"
  liquid_generators: ^0.0.1-1
  liquid_flutter_test_utils: ^1.7.0-3
  golden_toolkit: ^0.15.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
  shaders:
    - shaders/metaball.frag
  fonts:
    - family: Lato
      fonts:
        - asset: lib/fonts/Lato-Regular.ttf
    - family: NotoSansMono
      fonts:
        - asset: lib/fonts/NotoSansMono-Regular.ttf
          weight: 400
        - asset: lib/fonts/NotoSansMono-Bold.ttf
          weight: 700
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf
