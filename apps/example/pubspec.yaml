name: liquid
description: A new Flutter project.

version: 23.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace
publish_to: "none"

dependencies:
  flutter:
    sdk: flutter
  liquid_flutter:
    path: ../../packages/liquid_flutter
  liquid_flutter_emd_theme:
    path: ../../packages/liquid_flutter_emd_theme
  flutter_markdown: ^0.7.7
  flutter_animate: ^4.1.1
  flutter_portal: ^1.1.3
  syntax_highlight: ^0.5.0
  implicitly_animated_list: ^2.2.0

  provider: ^6.0.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  go_router: ^17.0.1
  package_info_plus: ^9.0.0
  web: ^1.1.0

  google_fonts: ^8.0.1
  url_launcher: ^6.3.1
  fuzzy: ^0.5.1
  collection: ^1.19.0
  #liquid_flutter_reactive_forms: 0.0.3
  lucide_icons_flutter: ^3.1.9
  shared_preferences: ^2.5.3
  jiffy: ^6.4.3

  mtrust_api_guard: ^5.1.0

  liquid_flutter_window_utils:
    path: ../../packages/liquid_flutter_window_utils
  liquid_flutter_md:
    path: ../../packages/liquid_flutter_md
  hooks: ^1.0.0
  responsive_builder: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  icons_launcher: ^3.0.1
  flutter_oss_licenses: ^3.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - liquid_flutter_icon.jpg
    - assets/
    - ../../packages/liquid_flutter/api_guard/api.json
    - lib/components/
    - lib/components/data_display/
    - lib/components/layout/
    - lib/components/interaction/
    - lib/components/feedback/
    - lib/components/form_elements/

  fonts:
    - family: Lato
      fonts:
        - asset: packages/liquid_flutter/fonts/Lato-Regular.ttf
          weight: 500
        - asset: packages/liquid_flutter/fonts/Lato-Bold.ttf
          weight: 800
    - family: EMD
      fonts:
        - asset: packages/liquid_flutter_emd_theme/fonts/EMD.ttf
    - family: LiquidIcons
      fonts:
        - asset: packages/liquid_flutter_emd_theme/fonts/LiquidIcons.ttf

    - family: NotoSansMono
      fonts:
        - asset: fonts/NotoSansMono-Regular.ttf
          weight: 500
        - asset: fonts/NotoSansMono-Bold.ttf
          weight: 800

icons_launcher:
  image_path: "liquid_flutter_icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true
    windows:
      enable: true
