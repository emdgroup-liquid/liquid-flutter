name: liquid_gen
description: AI-powered UI screen generator for Liquid Flutter.

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace
publish_to: "none"

dependencies:
  flutter:
    sdk: flutter
  liquid_flutter:
    path: ../../packages/liquid_flutter
  liquid_flutter_emd_theme:
    path: ../../packages/liquid_flutter_emd_theme
  liquid_flutter_window_utils:
    path: ../../packages/liquid_flutter_window_utils
  liquid_flutter_test_utils:
    path: ../../packages/liquid_flutter_test_utils
  provider: ^6.0.2
  go_router: ^17.0.1
  genui:
  genui_google_generative_ai:
  json_schema_builder:
  lucide_icons_flutter: ^3.1.9
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.0.0
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - ../../packages/liquid_flutter/api_guard/api.json

  fonts:
    - family: Lato
      fonts:
        - asset: packages/liquid_flutter/fonts/Lato-Regular.ttf
          weight: 500
        - asset: packages/liquid_flutter/fonts/Lato-Bold.ttf
          weight: 800
