name: Sync main to dev after updates

on:
  workflow_run:
    workflows: ["Release Main"]
    types:
      - completed
    branches:
      - main

jobs:
  sync_to_dev:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.bumper_app_id }}
          private-key: ${{ secrets.bumper_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "gh-actions@emdgroup.com"

      - name: Sync main to dev
        run: |
          # Make sure we have the latest main and dev
          git fetch origin main dev
          
          # Checkout dev
          git checkout dev
          
          # Try to merge main into dev
          if git merge origin/main -m "chore: sync changes from main [skip ci]" --no-edit; then
            echo "Merge successful without conflicts"
          else
            echo "Conflicts found — resolving..."

            # Keep main's package versions/changelogs to preserve release consistency.
            git checkout --theirs packages/*/pubspec.yaml || true
            git checkout --theirs packages/*/CHANGELOG.md || true
            git checkout --theirs CHANGELOG.md || true
            git add packages/*/pubspec.yaml packages/*/CHANGELOG.md CHANGELOG.md || true

            # Check if there are still unresolved conflicts in files not auto-resolved.
            if git ls-files -u | grep -q .; then
              echo "Still have unresolved conflicts in other files:"
              git ls-files -u
              exit 1
            fi

            # Complete the merge
            git commit -m "chore: sync changes from main with auto-resolved conflicts [skip ci]"
          fi

          # Push changes to dev
          git push origin dev