name: "PR to Dev"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev

jobs:
  validate_pr:
    permissions:
      pull-requests: write
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  validate_dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Install Git LFS
        run: sudo apt-get install -y git-lfs && git lfs install

      - name: Pull LFS files
        run: git lfs pull

      - name: Install Flutter
        uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Install extension dependencies
        run: cd extension/devtools/liquid_flutter_extension && flutter pub get
      - name: Install extension dependencies
        run: cd liquid_flutter_window_utils && flutter pub get
      - name: Run build runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Generate l10n
        run: flutter gen-l10n
      - name: Run tests
        run: flutter test
      - name: Upload test failures
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: test/failures/
          if-no-files-found: ignore
      - name: Run linter
        run: flutter analyze
      - name: Configure git
        run: |
          git fetch --prune
          git config --global user.name "GitHub Actions"
          git config --global user.email "gh-actions@emdgroup.com"

      - name: Install mtrust_api_guard
        run: dart pub global activate mtrust_api_guard
      - name: Compare API changes
        id: version
        run: mtrust_api_guard version --badge --no-commit --tag --generate-changelog --json version_output.json  ${{ inputs.pre_release && '--pre-release' || '' }}
      - name: Generate version summary and comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const versionOutput = fs.readFileSync('version_output.json', 'utf8');
              const versionData = JSON.parse(versionOutput);
              
              // Generate job summary
              const summary = `## Version Analysis
              
              **Next Version:** \`${versionData.version}\`
              
              ${versionData.badge ? `**Badge:**\n<img src="data:image/svg+xml;utf8,${encodeURIComponent(versionData.badge)}" alt="Version Badge" />` : ''}
              
              ### Changelog
              
              ${versionData.changelog || 'No changelog available.'}
              `;
              

              const jobSummary = core.summary;
              
              jobSummary
                .addHeading('Version Analysis')
                .addRaw(`\n\n**Next Version:** \`${versionData.version}\`\n\n`)
                .addRaw(versionData.badge ? `\n\n**Badge:**\n<img src="data:image/svg+xml;utf8,${encodeURIComponent(versionData.badge)}" alt="Version Badge" />` : '')
                .addHeading('Changelog', 3)
                .addRaw('\n\n')
                .addRaw(versionData.changelog || 'No changelog available.');
              
              await jobSummary.write();
              console.log('Job summary written');
              
              const comment = `## Version Analysis
              
              **Next Version:** \`${versionData.version}\`
              
              **Changelog:** 📄 [View detailed changelog in job summary](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              
              ${versionData.badge ? `**Badge:**\n<img src="data:image/svg+xml;utf8,${encodeURIComponent(versionData.badge)}" alt="Version Badge" />` : ''}
              `;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
              console.log('Successfully posted version analysis comment');
            } catch (error) {
              console.error('Error parsing version output or posting comment:', error);
              
              // Fallback comment with raw output
              const fallbackComment = `## Version Analysis (Raw Output)
              
              \`\`\`json
              ${{ steps.version.outputs.version_output }}
              \`\`\`
              `;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: fallbackComment
              });
            }
