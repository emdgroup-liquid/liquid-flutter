name: "Release Dev"

on:
  push:
    branches:
      - dev

jobs:
  release_packages:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get token for bumper app
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.bumper_app_id }}
          private-key: ${{ secrets.bumper_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          lfs: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2

      - name: Install Melos
        run: dart pub global activate melos

      - name: Install mtrust_api_guard
        run: dart pub global activate mtrust_api_guard 8.1.2

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Run analyzer
        run: melos run analyze

      - name: Run tests
        run: melos run test

      - name: Version, commit, and tag workspace packages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "gh-actions@emdgroup.com"
          mtrust_api_guard version-workspace \
            --pre-release \
            --badge \
            --generate-changelog \
            --json=version_output.json

      - name: Push branch and tags
        run: |
          /usr/bin/git push origin dev
          /usr/bin/git push origin --tags

      - name: Create prereleases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('version_output.json')) {
              core.info('No version_output.json, skipping prereleases');
              return;
            }
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            for (const [pkg, info] of Object.entries(data.packages || {})) {
              const pubspecPath = `packages/${pkg}/pubspec.yaml`;
              if (!fs.existsSync(pubspecPath)) continue;
              const pubspec = fs.readFileSync(pubspecPath, 'utf8');
              if (/^publish_to:\s*none/m.test(pubspec)) continue;

              const tag = `${pkg}/v${info.version}`;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `${pkg} ${info.version}`,
                body: info.changelog || 'No changelog available',
                prerelease: true,
              });
            }

      - name: Build example
        run: |
          cd apps/example
          flutter build web --release --base-href /liquid-flutter/dev/

      - name: Deploy example
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/example/build/web
          destination_dir: dev
