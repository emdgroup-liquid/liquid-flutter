name: "Release Dev"

on:
  push:
    branches:
      - dev

jobs:
  release_packages:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Get token for bumper app
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.bumper_app_id }}
          private-key: ${{ secrets.bumper_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2

      - name: Install Melos
        run: dart pub global activate melos

      - name: Install mtrust_api_guard
        run: dart pub global activate mtrust_api_guard 6.0.6

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Run analyzer
        run: melos run analyze

      - name: Run tests
        continue-on-error: true
        run: melos run test

      - name: Version workspace packages
        run: |
          mtrust_api_guard version-workspace \
            --pre-release \
            --no-commit \
            --no-tag \
            --badge \
            --generate-changelog \
            --json=version_output.json

      - name: Ensure liquid_flutter next dev version
        run: |
          node -e "
            const fs = require('fs');
            const targetVersion = '23.0.0-3';
            const outputPath = 'version_output.json';
            const pubspecPath = 'packages/liquid_flutter/pubspec.yaml';
            const dependentPubspecs = [
              'packages/liquid_flutter_emd_theme/pubspec.yaml',
              'packages/liquid_flutter_test_utils/pubspec.yaml',
              'packages/liquid_flutter_md/pubspec.yaml',
              'packages/liquid_generators/pubspec.yaml',
            ];
            const output = JSON.parse(fs.readFileSync(outputPath, 'utf8'));
            const existing = output?.packages?.liquid_flutter?.version;

            if (!output.packages) output.packages = {};

            if (!existing || existing.startsWith('23.0.0-1') || existing.startsWith('23.0.0-2')) {
              console.log('Applying fallback liquid_flutter dev version', targetVersion, 'existing=', existing || 'none');

              const pubspecContent = fs.readFileSync(pubspecPath, 'utf8');
              fs.writeFileSync(
                pubspecPath,
                pubspecContent.replace(/^version:\\s*.*/m, 'version: ' + targetVersion),
              );

              for (const depPath of dependentPubspecs) {
                if (!fs.existsSync(depPath)) continue;
                const content = fs.readFileSync(depPath, 'utf8');
                fs.writeFileSync(
                  depPath,
                  content.replace(/liquid_flutter:\\s*\\^[^\\n]+/g, 'liquid_flutter: ^' + targetVersion),
                );
              }

              output.packages.liquid_flutter = {
                version: targetVersion,
                changelog: '## ' + targetVersion + '\\nReleased on: automatic fallback dev bump to avoid duplicate 23.0.0-2 publish.\\n',
                badge: output.packages.liquid_flutter?.badge || '',
              };

              const changelogPath = 'packages/liquid_flutter/CHANGELOG.md';
              const changelogEntry = '## ' + targetVersion + '\\nReleased on: automatic fallback dev bump to avoid duplicate 23.0.0-2 publish.\\n\\n';
              const changelogContent = fs.readFileSync(changelogPath, 'utf8');
              if (!changelogContent.includes('## ' + targetVersion)) {
                fs.writeFileSync(
                  changelogPath,
                  changelogContent.replace(/^## Unreleased\\n\\n/, '## Unreleased\\n\\n' + changelogEntry),
                );
              }

              fs.writeFileSync(outputPath, JSON.stringify(output));
            } else {
              console.log('Using computed liquid_flutter version', existing);
            }
          "

      - name: Validate liquid_flutter next release
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            const value = data?.packages?.liquid_flutter?.version;
            if (!value) {
              console.error('liquid_flutter was not versioned. Expected 23.0.0-3 or higher.');
              process.exit(1);
            }
            const parse = (v) => {
              const [core] = v.split('-');
              return core.split('.').map((n) => Number(n));
            };
            const [ma, mi, pa] = parse(value);
            const [tma, tmi, tpa] = [23, 0, 0];
            const belowTarget = ma < tma || (ma === tma && mi < tmi) || (ma === tma && mi === tmi && pa < tpa);
            if (belowTarget) {
              console.error('liquid_flutter version is below 23.0.0-3 baseline target:', value);
              process.exit(1);
            }
            if (value.startsWith('23.0.0-1') || value.startsWith('23.0.0-2')) {
              console.error('Refusing duplicate/old liquid_flutter prerelease:', value);
              process.exit(1);
            }
            console.log('liquid_flutter next version:', value);
          "

      - name: Commit version updates
        run: |
          /usr/bin/git add packages version_output.json
          if /usr/bin/git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            /usr/bin/git -c user.name="GitHub Actions" -c user.email="gh-actions@emdgroup.com" commit -m "chore(release): version workspace packages [skip ci]"
          fi

      - name: Build devtools extension for publish validation
        run: |
          cd packages/liquid_flutter/extension/devtools/liquid_flutter_extension
          flutter pub get
          flutter build web --output=../build

      - name: Dry-run publish liquid_flutter
        run: |
          cd packages/liquid_flutter
          flutter pub publish --dry-run

      - name: Create and push tags
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            const info = data.packages?.liquid_flutter;
            if (!info) {
              console.error('liquid_flutter missing from version output');
              process.exit(1);
            }
            const tag = 'liquid_flutter/v' + info.version;
            console.log('Creating tag', tag);
            execSync('git tag ' + tag, { stdio: 'inherit' });
          "
          /usr/bin/git push origin dev
          /usr/bin/git push origin --tags

      - name: Create prereleases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            const info = data.packages?.liquid_flutter;
            if (!info) {
              core.setFailed('liquid_flutter missing from version output');
              return;
            }
            const tag = `liquid_flutter/v${info.version}`;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `liquid_flutter ${info.version}`,
              body: info.changelog || 'No changelog available',
              prerelease: true,
            });

      - name: Build example
        run: |
          cd apps/example
          flutter build web --release --base-href /liquid-flutter/dev/

      - name: Deploy example
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/example/build/web
          destination_dir: dev
