name: "Release Dev"

on:
  push:
    branches:
      - dev

jobs:
  release_packages:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Get token for bumper app
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.bumper_app_id }}
          private-key: ${{ secrets.bumper_key }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2

      - name: Install Melos
        run: dart pub global activate melos

      - name: Install mtrust_api_guard
        run: dart pub global activate mtrust_api_guard 6.0.6

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Run analyzer
        run: melos run analyze

      - name: Run tests
        run: melos run test

      - name: Version workspace packages
        run: |
          mtrust_api_guard version-workspace \
            --pre-release \
            --no-commit \
            --no-tag \
            --badge \
            --generate-changelog \
            --json=version_output.json

      - name: Validate liquid_flutter next release
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            const value = data?.packages?.liquid_flutter?.version;
            if (!value) {
              console.error('liquid_flutter was not versioned. Expected 23.0.0-3 or higher.');
              process.exit(1);
            }
            const parse = (v) => {
              const [core] = v.split('-');
              return core.split('.').map((n) => Number(n));
            };
            const [ma, mi, pa] = parse(value);
            const [tma, tmi, tpa] = [23, 0, 0];
            const belowTarget = ma < tma || (ma === tma && mi < tmi) || (ma === tma && mi === tmi && pa < tpa);
            if (belowTarget) {
              console.error('liquid_flutter version is below 23.0.0-3 baseline target:', value);
              process.exit(1);
            }
            if (value.startsWith('23.0.0-1') || value.startsWith('23.0.0-2')) {
              console.error('Refusing duplicate/old liquid_flutter prerelease:', value);
              process.exit(1);
            }
            console.log('liquid_flutter next version:', value);
          "

      - name: Dry-run publish changed packages
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            const packages = Object.keys(data.packages || {});
            for (const pkg of packages) {
              const pubspec = 'packages/' + pkg + '/pubspec.yaml';
              if (!fs.existsSync(pubspec)) continue;
              const content = fs.readFileSync(pubspec, 'utf8');
              if (/^publish_to:\s*none/m.test(content)) {
                console.log('Skipping dry-run for private package', pkg);
                continue;
              }
              console.log('Running dry-run publish for', pkg);
              execSync('cd packages/' + pkg + ' && flutter pub publish --dry-run', { stdio: 'inherit' });
            }
          "

      - name: Commit version updates
        run: |
          /usr/bin/git add packages version_output.json
          if /usr/bin/git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            /usr/bin/git -c user.name="GitHub Actions" -c user.email="gh-actions@emdgroup.com" commit -m "chore(release): version workspace packages [skip ci]"
          fi

      - name: Create and push tags
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            for (const [pkg, info] of Object.entries(data.packages || {})) {
              const tag = pkg + '/v' + info.version;
              console.log('Creating tag', tag);
              execSync('git tag ' + tag, { stdio: 'inherit' });
            }
          "
          /usr/bin/git push origin dev
          /usr/bin/git push origin --tags

      - name: Create prereleases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('version_output.json', 'utf8'));
            for (const [pkg, info] of Object.entries(data.packages || {})) {
              const tag = `${pkg}/v${info.version}`;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `${pkg} ${info.version}`,
                body: info.changelog || 'No changelog available',
                prerelease: true,
              });
            }

      - name: Build example
        run: |
          cd apps/example
          flutter build web --release --base-href /liquid-flutter/dev/

      - name: Deploy example
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/example/build/web
          destination_dir: dev
