name: liquid_flutter_monorepo
publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
workspace:
  - packages/liquid_flutter
  - packages/liquid_flutter_emd_theme
  - packages/liquid_flutter_window_utils
  - packages/liquid_generators
  - packages/liquid_flutter_test_utils
  - packages/liquid_flutter/extension/devtools/liquid_flutter_extension
  - packages/liquid_flutter_md
  - apps/example
dev_dependencies:
  melos: ^7.1.0

melos:
  categories:
    testable:
      - packages/liquid_flutter
      - packages/liquid_flutter_test_utils
  scripts:
    analyze: 
      exec: dart analyze
    test:
      exec: flutter test
      packageFilters:
        category: testable
    api_guard:
      run: mtrust_api_guard version-workspace --no-commit --no-tag --badge --generate-changelog --json=./version_output.json --pre-release
