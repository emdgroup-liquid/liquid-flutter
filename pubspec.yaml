name: liquid_flutter_monorepo
publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
workspace:
  - packages/liquid_flutter
  - packages/liquid_flutter_emd_theme
  - packages/liquid_flutter_window_utils
  - packages/liquid_generators
  - packages/liquid_flutter_test_utils
  - packages/liquid_flutter/extension/devtools/liquid_flutter_extension
  - apps/example
dev_dependencies:
  melos: ^7.1.0

melos:
  categories:
    testable:
      - packages/liquid_flutter
      - packages/liquid_flutter_test_utils
  scripts:
    test:
      exec: flutter test
      packageFilters:
        category: testable
    api_guard:
      packageFilters:
        diff: "origin/main...HEAD"
        noPrivate: true
      orderDependents: true
      concurrency: 1
      exec: mtrust_api_guard version --root=\$PWD --no-commit --no-tag --badge --generate-changelog --json=./version_output.json --tag-prefix=\$(basename \$PWD)/v --pre-release
